<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="./app.js" defer type="module"></script>
    <title>Lista de Contatos</title>
</head>

<body>

    <main>
        <h1>Cadastrar contato</h1>

        <article>
            <div id="erro" class="erro"></div>
            <form id="form-contato">
                <input type="hidden" id="id">
                <label for="nome"> Digite o nome
                    <input type="text" id="nome" placeholder="Nome" required>
                </label>
                <label for="email"> Digite o email
                    <input type="email" id="email" placeholder="Email" required>
                </label>
                <label for="telefone"> Digite o telefone
                    <input type="text" id="telefone" placeholder="Telefone" required>
                </label>
                <label for="preview-input" id="foto-contato">Adicione uma foto</label>
                <p class="image-field">
                    <input id="preview-input" class="preview-input" type="file" accept="image/*">
                    <label class="preview-label" for="preview-input"></label>
                    <img id="preview-image" class="preview-image" src="./img/upload-icon.svg">
                </p>
                <button type="submit">Salvar</button>
            </form>
        </article>

        <aside>
            <h2>Lista de contatos</h2>
            <div id="lista-contatos" class="lista"></div>
        </aside>
    </main>
</body>

</html>
